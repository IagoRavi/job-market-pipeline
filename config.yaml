# ============================================================
# Robô de vagas — configuração
# ============================================================

# Perfil e pisos salariais: valores PADRÃO e genéricos.
# Os seus valores reais ficam em config.local.yaml (fora do Git) ou no secret CONFIG_PRIVADO.
profile: |
  Brazil-based Data Analyst / BI Developer. Power BI (DAX, Power Query, RLS), SQL Server,
  dimensional modeling, Python. Open to remote work from Brazil or relocation to Europe.

salary:
  remote_min_annual_eur: 0
  remote_target_annual_eur: 0
  germany_min_annual_eur: 45934.20  # limite legal do Blue Card para TI (2026), informação pública
  relocation_min_annual_eur: 0

brazil:
  min_monthly_brl: 0
  home_cities: []
  onsite_elsewhere_penalty: 0

# Fontes. Desative com enabled: false
sources:
  arbeitnow:  { enabled: true, max_pages: 4 }
  remotive:   { enabled: true, categories: [data, software-dev] }
  remoteok:   { enabled: true, tags: [data, analyst, sql] }
  himalayas:  { enabled: true, max_pages: 5 }
  # Páginas públicas de vagas de empresas específicas (ATS).
  # Pegue o identificador na URL da página de vagas da empresa:
  #   boards.greenhouse.io/<id>   jobs.lever.co/<id>   jobs.ashbyhq.com/<id>
  # Empresas-alvo (verificadas em 07/10/2026). Remoto global/EMEA ou escritórios na Europa.
  greenhouse:
    enabled: true
    boards: [n26, adyen, getyourguide, hellofresh, celonis, contentful, wolt,  # Europa
             gitlab, canonical]                                                 # 100% remoto global
  lever:
    enabled: true
    companies: [spotify]
  ashby:
    enabled: true
    boards: [oyster, posthog, n8n, supabase]                                   # remote-first
  # Requer ADZUNA_APP_ID e ADZUNA_APP_KEY (cadastro gratuito em developer.adzuna.com)
  adzuna:
    enabled: true
    countries: [de, nl, at, es, fr, gb, br]
    queries: ["power bi", "business intelligence", "data analyst sql"]

  # Brasil: portal público da Gupy (Itaú, Petrobras, Magalu, Ambev e milhares de outras)
  gupy:
    enabled: false                  # API pública da Gupy fora do ar (out/2026)
    max_pages: 5                    # 10 vagas por página, por palavra-chave
    endpoint: ""                    # se a Gupy mudar a API, cole aqui a URL (sem ?parâmetros)
    query_param: jobName            # nome do parâmetro da palavra-chave nessa URL
    keywords: [power bi, business intelligence, analista de dados, analista de bi,
               desenvolvedor bi, engenheiro de analytics]
  # LinkedIn: lê os alertas de vaga que o LinkedIn manda para o seu Gmail.
  # Requer GMAIL_USER e GMAIL_APP_PASSWORD (senha de app do Google)
  linkedin:
    enabled: true
    days_back: 3
    senders: [jobalerts-noreply@linkedin.com]

# Palavras-chave
keywords:
  title_strong: [power bi, bi developer, bi engineer, bi analyst, bi consultant,
                 business intelligence, analytics engineer, data analyst,
                 reporting analyst, reporting specialist, dashboard,
                 analista de dados, analista de bi, analista de business intelligence,
                 desenvolvedor bi, desenvolvedor de bi, desenvolvedor power bi,
                 engenheiro de analytics, especialista em bi, especialista em power bi,
                 analista de inteligência de dados, consultor bi, consultor de bi]
  title_weak: [data engineer, sql developer, analytics, insights analyst, data specialist,
               engenheiro de dados, analista de informações, especialista em dados, analista de relatórios]
  title_exclude: [intern, internship, werkstudent, praktikum, working student, trainee,
                  sales, account executive, recruiter, data scientist phd,
                  estágio, estagiário, estagiária, jovem aprendiz, aprendiz, vendas]
  skills:   # palavra: peso
    power bi: 8
    dax: 6
    sql: 6
    sql server: 3
    t-sql: 3
    power query: 3
    python: 4
    star schema: 3
    data model: 2
    etl: 2
    fastapi: 2
    pandas: 1
    modelagem dimensional: 3
    modelagem de dados: 2

eligibility:
  remote_ok: [worldwide, anywhere, latam, latin america, brazil, brasil,
              south america, americas, global, all countries, timezone flexible]
  relocation_ok: [visa sponsorship, sponsor visa, visa support, relocation,
                  blue card, relocation package, we sponsor]
  blockers: [us only, usa only, u.s. only, us-based only, must be based in the us,
             must reside in the us, uk only, eu citizens only, eu work permit,
             right to work in the uk, right to work in the eu, no visa sponsorship,
             unable to sponsor, cannot sponsor, canada only, north america only]
  language_blockers: [fluent german, german (c1, german c1, german (b2, german b2,
                      business fluent german, fließend deutsch, deutschkenntnisse,
                      fluent dutch, dutch (c1, fluent french, native french, fluent italian,
                      fluent polish, fluent swedish]

llm:
  enabled: true
  # github    → grátis; no GitHub Actions usa o próprio GITHUB_TOKEN (sem cadastro)
  # gemini    → grátis com GEMINI_API_KEY (aistudio.google.com)
  # groq      → grátis com GROQ_API_KEY (console.groq.com)
  # anthropic → pago, ANTHROPIC_API_KEY
  provider: github
  model: ""                           # vazio = modelo padrão do provedor
  min_heuristic_score: 40             # só manda pra IA o que passou no pré-filtro
  max_per_run: 25

digest:
  min_score: 60
  max_per_region: 10                # Europa, Remoto global, Brasil, Outras
  report_url: "https://iagoravi.github.io/job-market-pipeline/"  # link do GitHub Pages, ex.: https://iagoravi.github.io/robo-vagas/
